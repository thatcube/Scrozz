# Scrozz release build.
#
# Triggered by a version tag. Builds release binaries for macOS, Windows and
# Linux, checksums them, and opens a **draft** GitHub release.
#
# It never publishes. Decision D5 is explicit that agents implement and validate
# but the maintainer gates shipping, so the last step is always a human pressing
# "Publish release" after looking at what is in it.
#
# ---------------------------------------------------------------------------
# Signing policy
# ---------------------------------------------------------------------------
# macOS can emit an explicitly unsigned external-signing handoff when its
# secrets are absent. Windows release artifacts fail closed: the executable,
# Store identity (including its display name), and MSIX signature must agree.
# No credential is invented, committed, or silently replaced by a development
# identity.
name: Release

on:
  push:
    tags:
      # v1.2.3, v1.2.3-beta.1, and so on.
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  RUST_VERSION: "1.98.0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    # GitHub hides ruleset bypass actors without Administration write access.
    # Keep that powerful readback token in this separately approved environment;
    # the workflow uses it only for GET and never mutates repository settings.
    environment: release-ruleset-audit
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error title=Invalid release tag::$RELEASE_TAG is not a supported version tag."
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            PRERELEASE="${RELEASE_TAG#*-}"
            IFS='.' read -r -a PRERELEASE_PARTS <<<"$PRERELEASE"
            for part in "${PRERELEASE_PARTS[@]}"; do
              if [[ "$part" =~ ^0[0-9]+$ ]]; then
                echo "::error title=Invalid release tag::Numeric prerelease identifiers cannot have leading zeroes: $RELEASE_TAG"
                exit 1
              fi
            done
          fi
          echo "tag=$RELEASE_TAG" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', steps.tag.outputs.tag) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin release source
        id: source
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$SHA" != "$TAG_SHA" ]]; then
            echo "::error title=Release tag moved::Checkout $SHA does not match tag commit $TAG_SHA."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            EVENT_COMMIT="$(git rev-parse "$EVENT_SHA^{commit}")"
            if [[ "$EVENT_COMMIT" != "$TAG_SHA" ]]; then
              echo "::error title=Release tag moved::The push event named $EVENT_COMMIT, but $RELEASE_TAG now resolves to $TAG_SHA."
              exit 1
            fi
          fi
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"

      - name: Require immutable release-tag ruleset
        env:
          RULESET_ID: ${{ vars.RELEASE_TAG_RULESET_ID }}
          RULESET_TOKEN: ${{ secrets.RELEASE_RULESET_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$RULESET_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Release tag ruleset missing::Set repository variable RELEASE_TAG_RULESET_ID to an active tag ruleset that forbids updates/deletions of refs/tags/v* with no bypass actors."
            exit 1
          fi
          if [[ -z "$RULESET_TOKEN" ]]; then
            echo "::error title=Release ruleset token missing::The release-ruleset-audit environment secret RELEASE_RULESET_TOKEN needs Administration write permission because GitHub hides bypass actors from read-level callers. This workflow uses it only for GET."
            exit 1
          fi
          RULESET="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $RULESET_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/rulesets/$RULESET_ID"
          )"
          jq -e '
            .target == "tag" and
            .enforcement == "active" and
            has("bypass_actors") and
            (.bypass_actors | length) == 0 and
            (.conditions.ref_name.include | index("refs/tags/v*")) != null and
            (.conditions.ref_name.exclude | length) == 0 and
            ([.rules[].type] | index("update")) != null and
            ([.rules[].type] | index("deletion")) != null
          ' <<<"$RULESET" >/dev/null || {
            echo "::error title=Release tags are mutable::Ruleset $RULESET_ID must actively block updates and deletion of refs/tags/v* without bypass actors."
            exit 1
          }

  # ---------------------------------------------------------------------------
  # Build one release artefact per platform.
  # ---------------------------------------------------------------------------
  build:
    name: Build — ${{ matrix.name }}
    needs: resolve
    # Configure this environment with a required reviewer before adding signing
    # secrets. No unapproved job can then reach private release identities.
    environment: release-signing
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Publish nothing rather than a partial set: if Windows fails we still
      # want to see whether macOS and Linux succeeded, so the draft can be
      # assembled once the cause is fixed.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (universal)
            slug: macos-universal
            archive: tar.gz
          - os: ubuntu-latest
            name: Linux (x86_64)
            slug: linux-x86_64
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            name: Windows (x86_64)
            slug: windows-x86_64
            target: x86_64-pc-windows-msvc
            archive: zip
          # An arm64 Linux runner (`ubuntu-24.04-arm`) is available to public
          # repositories. Adding a `linux-aarch64` entry here is all it takes,
          # once somebody can actually test the result — see docs/platforms.md
          # on the difference between "it builds" and "it works".

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          # macOS builds both architectures and lipos them together; the others
          # build for the host only.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: tools/ci-linux-deps.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.slug }}

      - name: Determine version
        id: version
        env:
          RELEASE_REF: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          REF="$RELEASE_REF"
          if [[ "$REF" != v* ]]; then
            echo "::error title=Invalid release tag::Release tags must start with v: $REF"
            exit 1
          fi
          VERSION="${REF#v}"

          CARGO_METADATA="$(
            cargo metadata --locked --no-deps --format-version 1
          )"
          WORKSPACE_VERSION_COUNT="$(
            jq '[.packages[] | select(.name == "scrozz")] | length' \
              <<<"$CARGO_METADATA"
          )"
          if [[ "$WORKSPACE_VERSION_COUNT" -ne 1 ]]; then
            echo "::error title=Workspace version unavailable::Expected exactly one scrozz package in Cargo workspace metadata."
            exit 1
          fi
          CARGO_VERSION="$(
            jq -r '.packages[] | select(.name == "scrozz") | .version' \
              <<<"$CARGO_METADATA"
          )"
          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error title=Release version mismatch::Tag $REF names $VERSION, but the Cargo workspace package version is $CARGO_VERSION."
            exit 1
          fi

          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "Building version $VERSION from $REF"

      - name: Select monotonic MSIX version
        if: matrix.os == 'windows-latest'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid release version::$VERSION is not a supported semantic version."
            exit 1
          fi
          SEMVER_MAJOR="${BASH_REMATCH[1]}"
          SEMVER_MINOR="${BASH_REMATCH[2]}"
          SEMVER_PATCH="${BASH_REMATCH[3]}"
          if (( SEMVER_MAJOR > 65534 ||
                SEMVER_MINOR > 255 ||
                SEMVER_PATCH > 255 )); then
            echo "::error title=MSIX version overflow::MSIX mapping requires semantic major <= 65534 and minor/patch <= 255."
            exit 1
          fi
          NATIVE_MAJOR=$((SEMVER_MAJOR + 1))
          NATIVE_MINOR=$((SEMVER_MINOR * 256 + SEMVER_PATCH))

          # Store versions require a nonzero first component and a zero fourth
          # component. The semantic minor/patch pair is packed into component
          # two; component three orders prereleases below the stable release.
          if [[ "$VERSION" == *-* ]]; then
            NATIVE_BUILD="$GITHUB_RUN_NUMBER"
            if (( NATIVE_BUILD < 1 || NATIVE_BUILD > 65534 )); then
              echo "::error title=MSIX build exhausted::GitHub run number $NATIVE_BUILD is outside the reserved prerelease range 1..65534."
              exit 1
            fi
          else
            NATIVE_BUILD=65535
          fi
          MSIX_VERSION="${NATIVE_MAJOR}.${NATIVE_MINOR}.${NATIVE_BUILD}.0"
          echo "SCROZZ_MSIX_VERSION=$MSIX_VERSION" >>"$GITHUB_ENV"
          echo "MSIX package version: $MSIX_VERSION"

      # --- Compile ------------------------------------------------------------
      - name: Build (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          # Two builds and a lipo, rather than one build, because a universal
          # binary is the only kind that runs natively on both Apple Silicon
          # and the Intel Macs still in use.
          cargo build --release --locked --target aarch64-apple-darwin --bin scrozz
          cargo build --release --locked --target x86_64-apple-darwin --bin scrozz
          mkdir -p dist
          UNIVERSAL_BINARY="$PWD/dist/scrozz"
          lipo -create -output "$UNIVERSAL_BINARY" \
            target/aarch64-apple-darwin/release/scrozz \
            target/x86_64-apple-darwin/release/scrozz
          lipo -info "$UNIVERSAL_BINARY"

          BASE_VERSION="${{ steps.version.outputs.version }}"
          BASE_VERSION="${BASE_VERSION%%-*}"
          SCROZZ_PREBUILT_BIN="$UNIVERSAL_BINARY" \
            SCROZZ_APP_VERSION="$BASE_VERSION" \
            SCROZZ_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            SCROZZ_SIGNING_MODE=external-release \
            SCROZZ_ALLOW_EXTERNAL_SIGNING=1 \
            tools/make-app-bundle.sh "$PWD/dist/Scrozz.app"
          rm -f "$UNIVERSAL_BINARY"
          lipo -info dist/Scrozz.app/Contents/MacOS/Scrozz

      - name: Build (single target)
        if: matrix.os != 'macos-latest'
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" --bin scrozz
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/scrozz.exe" dist/
          else
            cp "target/${{ matrix.target }}/release/scrozz" dist/
          fi

      - name: Acquire pinned Windows Tesseract payload
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ManifestPath = Join-Path `
            $env:GITHUB_WORKSPACE "packaging\windows\tesseract-payload.json"
          $Manifest = Get-Content -LiteralPath $ManifestPath -Raw |
            ConvertFrom-Json
          if ($Manifest.schema -ne 1) {
            throw "Unsupported Tesseract payload manifest schema"
          }

          function Assert-Sha256 {
            param([string] $Path, [string] $Expected)
            $Actual = (
              Get-FileHash -LiteralPath $Path -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            if ($Actual -ne $Expected.ToLowerInvariant()) {
              throw "SHA-256 mismatch for ${Path}: expected $Expected, found $Actual"
            }
          }

          $Package = $Manifest.chocolatey_package
          $PackageId = [string] $Package.id
          $PackageVersion = [string] $Package.version
          $DownloadRoot = Join-Path $env:RUNNER_TEMP "scrozz-tesseract"
          Remove-Item -LiteralPath $DownloadRoot -Recurse -Force `
            -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $DownloadRoot | Out-Null
          $Nupkg = Join-Path `
            $DownloadRoot "$PackageId.$PackageVersion.nupkg"
          Invoke-WebRequest -Uri $Package.url -OutFile $Nupkg
          Assert-Sha256 $Nupkg $Package.sha256

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $Archive = [IO.Compression.ZipFile]::OpenRead($Nupkg)
          try {
            $InstallerEntry = $Archive.GetEntry($Package.installer_path)
            if ($null -eq $InstallerEntry) {
              throw "Verified nupkg is missing $($Package.installer_path)"
            }
            $Stream = $InstallerEntry.Open()
            $Hasher = [Security.Cryptography.SHA256]::Create()
            try {
              $InstallerHash = [BitConverter]::ToString(
                $Hasher.ComputeHash($Stream)
              ).Replace("-", "").ToLowerInvariant()
            } finally {
              $Hasher.Dispose()
              $Stream.Dispose()
            }
            if ($InstallerHash -ne $Package.installer_sha256) {
              throw "Embedded Tesseract installer checksum mismatch"
            }
          } finally {
            $Archive.Dispose()
          }

          # This local-only source plus ignored dependencies prevents Chocolatey
          # from resolving any mutable package during release acquisition.
          choco.exe install $PackageId `
            "--version=$PackageVersion" `
            "--source=$DownloadRoot" `
            --yes `
            --no-progress `
            --require-checksums `
            --ignore-dependencies `
            --allow-downgrade `
            --force
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey failed to install the verified local Tesseract package"
          }

          $Tesseract = Join-Path $env:ProgramFiles "Tesseract-OCR"
          $Tessdata = Join-Path $Tesseract "tessdata"
          New-Item -ItemType Directory -Path $Tessdata -Force | Out-Null
          $Model = $Manifest.language_model
          $DownloadedModel = Join-Path $DownloadRoot $Model.name
          Invoke-WebRequest -Uri $Model.url -OutFile $DownloadedModel
          Assert-Sha256 $DownloadedModel $Model.sha256
          Move-Item `
            -LiteralPath $DownloadedModel `
            -Destination (Join-Path $Tessdata $Model.name) `
            -Force

          $ExpectedDlls = @()
          foreach ($PayloadFile in @($Manifest.payload_files)) {
            $RelativePath = [string] $PayloadFile.path
            $NativePath = $RelativePath.Replace(
              "/", [IO.Path]::DirectorySeparatorChar
            )
            $InstalledPath = Join-Path $Tesseract $NativePath
            if (-not (Test-Path -LiteralPath $InstalledPath -PathType Leaf)) {
              throw "Verified Tesseract payload is missing $RelativePath"
            }
            Assert-Sha256 $InstalledPath $PayloadFile.sha256
            if ($RelativePath -match "^[0-9A-Za-z.+_-]+\.dll$") {
              $ExpectedDlls += $RelativePath
            }
          }
          $ExpectedDlls = @($ExpectedDlls | Sort-Object)
          $ActualDlls = @(
            Get-ChildItem -LiteralPath $Tesseract -Filter "*.dll" -File |
              ForEach-Object { $_.Name } |
              Sort-Object
          )
          $DllDifference = @(
            Compare-Object `
              -ReferenceObject $ExpectedDlls `
              -DifferenceObject $ActualDlls
          )
          if ($DllDifference.Count -ne 0) {
            throw "Installed Tesseract runtime DLL closure differs from the manifest"
          }

          $TesseractExecutable = Join-Path $Tesseract "tesseract.exe"
          $Languages = @(
            & $TesseractExecutable `
              --tessdata-dir $Tessdata `
              --list-langs 2>&1
          )
          if ($LASTEXITCODE -ne 0 -or $Languages -notcontains "eng") {
            throw "Verified Tesseract payload cannot load the pinned English model"
          }

          "SCROZZ_TESSERACT_DIR=$Tesseract" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # --- macOS signing and notarisation (skipped unless secrets exist) ------
      #
      # Requires, all as repository secrets:
      #   MACOS_CERTIFICATE_P12       base64 of a Developer ID Application .p12
      #   MACOS_CERTIFICATE_PASSWORD  its export password
      #   MACOS_SIGN_IDENTITY         e.g. "Developer ID Application: Name (TEAMID)"
      #   MACOS_NOTARY_KEY            base64 of an App Store Connect .p8 API key
      #   MACOS_NOTARY_KEY_ID         that key's ID
      #   MACOS_NOTARY_ISSUER_ID      the issuer UUID
      - name: Sign and notarise macOS app (when configured)
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$MACOS_CERTIFICATE_P12" ]]; then
            echo "::notice title=macOS app is unsigned::No MACOS_CERTIFICATE_P12 secret is set, so signing and notarisation were skipped. Gatekeeper will block this app on other people's machines until a Developer ID certificate is configured."
            exit 0
          fi
          : "${MACOS_SIGN_IDENTITY:?MACOS_SIGN_IDENTITY is required}"
          : "${MACOS_NOTARY_KEY:?MACOS_NOTARY_KEY is required}"
          : "${MACOS_NOTARY_KEY_ID:?MACOS_NOTARY_KEY_ID is required}"
          : "${MACOS_NOTARY_ISSUER_ID:?MACOS_NOTARY_ISSUER_ID is required}"

          # A throwaway keychain, so the certificate never touches the login
          # keychain and dies with the runner.
          KEYCHAIN="$RUNNER_TEMP/scrozz-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/scrozz-signing.p12"
          NOTARY_KEY="$RUNNER_TEMP/scrozz-notary.p8"
          NOTARY_ARCHIVE="$RUNNER_TEMP/scrozz-notarize.zip"
          cleanup_signing_material() {
            rm -f "$CERTIFICATE" "$NOTARY_KEY" "$NOTARY_ARCHIVE"
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
          }
          trap cleanup_signing_material EXIT

          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode >"$CERTIFICATE"
          security import "$CERTIFICATE" \
            -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" dist/Scrozz.app
          codesign --verify --strict --verbose=2 dist/Scrozz.app

          echo "$MACOS_NOTARY_KEY" | base64 --decode >"$NOTARY_KEY"
          ditto -c -k --keepParent dist/Scrozz.app "$NOTARY_ARCHIVE"
          xcrun notarytool submit "$NOTARY_ARCHIVE" \
            --key "$NOTARY_KEY" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/Scrozz.app
          xcrun stapler validate dist/Scrozz.app
          spctl --assess --type execute --verbose=2 dist/Scrozz.app
          echo "SCROZZ_MACOS_PAYLOAD_SIGNED=1" >>"$GITHUB_ENV"
          echo "SCROZZ_MACOS_NOTARIZED=1" >>"$GITHUB_ENV"

      # --- Windows signing ----------------------------------------------------
      #
      # Requires, as repository secrets:
      #   WINDOWS_CERTIFICATE_PFX       base64 of a code-signing .pfx
      #   WINDOWS_CERTIFICATE_PASSWORD  its password
      #
      # A cheaper, keyless alternative worth considering before buying an EV
      # certificate is Azure Trusted Signing, which swaps these two secrets for
      # an Azure identity and a different action.
      - name: Sign Windows executable
        if: matrix.os == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$WINDOWS_CERTIFICATE_PFX" ]]; then
            echo "::error title=Windows signing identity is required::Release packaging fails closed instead of publishing a weaker unsigned executable."
            exit 1
          fi
          PFX="$RUNNER_TEMP/scrozz-executable-signing.pfx"
          trap 'rm -f "$PFX"' EXIT
          echo "$WINDOWS_CERTIFICATE_PFX" | base64 --decode >"$PFX"

          # signtool lives in the Windows SDK, whose directory is versioned.
          # Find the newest rather than hard-coding a version that a runner
          # image update will silently remove.
          SIGNTOOL="$(find '/c/Program Files (x86)/Windows Kits/10/bin' \
            -name 'signtool.exe' -path '*x64*' 2>/dev/null | sort | tail -n 1)"
          if [[ -z "$SIGNTOOL" ]]; then
            echo "::error title=signtool not found::The Windows SDK layout on this runner image changed. Look under '/c/Program Files (x86)/Windows Kits/10/bin' (the Git-bash spelling of C:\\Program Files...) and update the find in this step."
            exit 1
          fi

          "$SIGNTOOL" sign \
            /f "$PFX" \
            /p "$WINDOWS_CERTIFICATE_PASSWORD" \
            /fd SHA256 \
            /tr http://timestamp.digicert.com \
            /td SHA256 \
            dist/scrozz.exe
          "$SIGNTOOL" verify /pa dist/scrozz.exe

      # --- Package ------------------------------------------------------------
      - name: Package
        if: matrix.os != 'windows-latest'
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          NAME="scrozz-${VERSION}-${{ matrix.slug }}"

          # GPL-3.0 obliges us to ship the licence with the binary (D2), and
          # the trademark terms travel with it.
          cp LICENSE TRADEMARK.md README.md dist/

          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "../${NAME}.zip" ./* >/dev/null
            ASSET="${NAME}.zip"
          else
            tar -czf "../${NAME}.tar.gz" ./*
            ASSET="${NAME}.tar.gz"
          fi
          cd ..

          # Checksum per artefact now; the release job concatenates them into a
          # single SHA256SUMS file people can actually verify against.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" >"${ASSET}.sha256"
          else
            shasum -a 256 "$ASSET" >"${ASSET}.sha256"
          fi

          PACKAGE_KIND=portable-archive
          PAYLOAD_SIGNED=false
          NOTARIZED=false
          PACKAGE_IDENTITY=""
          NATIVE_PACKAGE_VERSION="$VERSION"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            PACKAGE_KIND=app-bundle-archive
            PACKAGE_IDENTITY=com.thatcube.Scrozz
            NATIVE_PACKAGE_VERSION="${VERSION%%-*}"
            if [[ "${SCROZZ_MACOS_PAYLOAD_SIGNED:-0}" == "1" ]]; then
              PAYLOAD_SIGNED=true
            fi
            if [[ "${SCROZZ_MACOS_NOTARIZED:-0}" == "1" ]]; then
              NOTARIZED=true
            fi
          fi
          python3 - \
            "$ASSET" \
            "$VERSION" \
            "$NATIVE_PACKAGE_VERSION" \
            "${{ matrix.slug }}" \
            "$PACKAGE_KIND" \
            "$PACKAGE_IDENTITY" \
            "$PAYLOAD_SIGNED" \
            "$NOTARIZED" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          asset = pathlib.Path(sys.argv[1])
          metadata = {
              "schema": 1,
              "platform": sys.argv[4],
              "version": sys.argv[2],
              "file": asset.name,
              "sha256": hashlib.sha256(asset.read_bytes()).hexdigest(),
              "size": asset.stat().st_size,
              "package_kind": sys.argv[5],
              "native_package_version": sys.argv[3],
              "package_identity": sys.argv[6],
              "signed": False,
              "payload_signed": sys.argv[7] == "true",
              "notarized": sys.argv[8] == "true",
              "signed_manifest": False,
          }
          pathlib.Path(f"{asset}.artifact.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          cat "${ASSET}.sha256"
          echo "asset=$ASSET" >>"$GITHUB_OUTPUT"

      - name: Package portable ZIP and MSIX
        if: matrix.os == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_MSIX_IDENTITY_NAME: ${{ secrets.WINDOWS_MSIX_IDENTITY_NAME }}
          WINDOWS_MSIX_PUBLISHER: ${{ secrets.WINDOWS_MSIX_PUBLISHER }}
          WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          set -euo pipefail
          export SCROZZ_WINDOWS_VERIFY_DETERMINISM=1
          export SCROZZ_MSIX_IDENTITY_MODE=store
          export SCROZZ_MSIX_IDENTITY_NAME="$WINDOWS_MSIX_IDENTITY_NAME"
          export SCROZZ_MSIX_PUBLISHER="$WINDOWS_MSIX_PUBLISHER"
          export SCROZZ_MSIX_PUBLISHER_DISPLAY_NAME="$WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME"

          PFX="$RUNNER_TEMP/scrozz-msix-signing.pfx"
          trap 'rm -f "$PFX"' EXIT
          if [[ -z "$WINDOWS_CERTIFICATE_PFX" ||
                -z "$WINDOWS_MSIX_IDENTITY_NAME" ||
                -z "$WINDOWS_MSIX_PUBLISHER" ||
                -z "$WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME" ]]; then
            echo "::error title=Complete Store identity is required::WINDOWS_CERTIFICATE_PFX, WINDOWS_MSIX_IDENTITY_NAME, WINDOWS_MSIX_PUBLISHER, and WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME must all be configured. Development identity values are never a release fallback."
            exit 1
          fi
          echo "$WINDOWS_CERTIFICATE_PFX" | base64 --decode >"$PFX"
          export SCROZZ_MSIX_SIGN_PFX="$PFX"
          export SCROZZ_MSIX_SIGN_PFX_PASSWORD="$WINDOWS_CERTIFICATE_PASSWORD"

          powershell.exe -NoLogo -NoProfile -NonInteractive \
            -ExecutionPolicy Bypass \
            -File tools/package-windows.ps1 \
            -OutputDirectory release-artifacts \
            -Binary dist/scrozz.exe \
            -Version "${{ steps.version.outputs.version }}" \
            -Stamp release \
            -Architecture x86_64

      - name: Upload artefact
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
            ${{ steps.package.outputs.asset }}.artifact.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Assemble the checksums and open a DRAFT release.
  # ---------------------------------------------------------------------------
  checksums-and-draft:
    name: Draft release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The one job that needs write access, and only for creating the release.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          # One file, sorted, in the format `sha256sum -c` expects.
          cat ./*.sha256 | sort -k2 >SHA256SUMS
          rm -f ./*.sha256
          {
            echo "### Artefacts"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Optional detached signature over the checksum file — the customary way
      # to make a Linux release verifiable without any platform certificate.
      # Requires secrets GPG_PRIVATE_KEY (ASCII-armoured) and GPG_PASSPHRASE.
      - name: Sign SHA256SUMS (when configured)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::notice title=Checksums are unsigned::No GPG_PRIVATE_KEY secret is set, so the detached checksum signature was skipped."
            exit 0
          fi
          GNUPGHOME="$RUNNER_TEMP/scrozz-release-gnupg"
          rm -rf "$GNUPGHOME"
          mkdir -m 700 "$GNUPGHOME"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd artifacts
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PINNED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail

          REMOTE_TAGS="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          REMOTE_SHA="$(
            awk '$2 ~ /\^\{\}$/ { print $1; found=1 } END { if (!found) exit 1 }' \
              <<<"$REMOTE_TAGS" 2>/dev/null ||
            awk '$2 !~ /\^\{\}$/ { print $1; exit }' <<<"$REMOTE_TAGS"
          )"
          if [[ -z "$REMOTE_SHA" || "$REMOTE_SHA" != "$PINNED_SHA" ]]; then
            echo "::error title=Release tag moved::$TAG now resolves to ${REMOTE_SHA:-nothing}, not the reviewed source $PINNED_SHA."
            exit 1
          fi

          # --draft is the point of this whole job. Decision D5: agents build
          # and validate, the maintainer decides what ships. Nothing here is
          # ever visible to the public until a human presses Publish.
          #
          # --verify-tag refuses to invent a tag that does not exist, which
          # turns a typo in workflow_dispatch into an error rather than a
          # release built from the wrong commit.
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --target "$PINNED_SHA" \
            --title "Scrozz $TAG" \
            --generate-notes \
            artifacts/*

          echo "::notice title=Draft release created::Review it, then publish by hand. Nothing has been made public."

      - name: Summarise what is and is not signed
        run: |
          python3 <<'PY' >>"$GITHUB_STEP_SUMMARY"
          import hashlib
          import json
          import pathlib

          root = pathlib.Path("artifacts")
          metadata_paths = sorted(root.glob("*.artifact.json"))
          if not metadata_paths:
              raise SystemExit("release artifacts have no signing metadata")

          print("### Signing status")
          print()
          print("| Artifact | Package | Container signed | Payload signed | Notarized/stapled |")
          print("|---|---|---:|---:|---:|")
          for metadata_path in metadata_paths:
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              artifact = root / metadata["file"]
              if not artifact.is_file():
                  raise SystemExit(f"metadata references missing artifact: {artifact}")
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              if digest != metadata["sha256"]:
                  raise SystemExit(f"metadata checksum mismatch: {artifact}")

              yes_no = lambda value: "yes" if value else "no"
              notarized = (
                  yes_no(metadata["notarized"])
                  if "notarized" in metadata
                  else "n/a"
              )
              print(
                  f"| `{metadata['file']}` "
                  f"| {metadata['package_kind']} "
                  f"| {yes_no(metadata['signed'])} "
                  f"| {yes_no(metadata['payload_signed'])} "
                  f"| {notarized} |"
              )

          checksum_signature = yes_no((root / "SHA256SUMS.asc").is_file())
          print()
          print(f"Detached GPG signature for `SHA256SUMS`: **{checksum_signature}**.")
          print()
          print(
              "Windows executable and MSIX package signatures are reported "
              "separately from artifact metadata. A PFX enables executable "
              "signing; MSIX signing additionally requires Store identity and "
              "publisher values."
          )
          print(
              "Signing uses `MACOS_CERTIFICATE_P12`, "
              "`WINDOWS_CERTIFICATE_PFX`, or `GPG_PRIVATE_KEY` only in the "
              "specific step that consumes it."
          )
          print()
          print("This release is a **draft**. Publishing it is a human decision (D5).")
          PY
