# Scrozz release build.
#
# Triggered by a version tag. Builds release binaries for macOS, Windows and
# Linux and checksums them. Stable tags open a draft for maintainer approval;
# `-alpha.N` tags publish a clearly labelled GitHub prerelease for opt-in testing.
#
# ---------------------------------------------------------------------------
# Signing policy
# ---------------------------------------------------------------------------
# Every signing step below is gated on a secret being present and is skipped
# with a notice when it is not. No credential is invented, committed, or
# implied to exist. The repository secrets Brandon must create himself, if and
# when he wants signed builds, are listed in each step's comment and summarised
# in the `checksums-and-draft` job's final output.
#
# Until then this workflow produces working *unsigned* artefacts, which macOS
# Gatekeeper and Windows SmartScreen will both complain about. That is the
# correct state for a project that has not yet decided to pay for certificates.
#
# ---------------------------------------------------------------------------
# macOS ships a bundle, not a binary
# ---------------------------------------------------------------------------
# The macOS artefact is a conventional drag-to-Applications DMG containing
# Scrozz.app. The bundle identity is a functional requirement: macOS attaches a
# Screen Recording grant to that identity, not to a loose executable. The app is
# assembled by tools/make-app-bundle.sh, signed, notarised and stapled before
# tools/make-dmg.sh puts it in the disk image.
# macOS can emit an explicitly unsigned external-signing handoff when its
# secrets are absent. Stable Windows release artifacts fail closed: executable,
# Store identity, and MSIX signature must agree. Alpha tags may publish only the
# explicitly unsigned portable ZIP when all Windows identity secrets are absent;
# they never invent or publish a development-identity MSIX.
name: Release

on:
  push:
    tags:
      # Plozz-style CalVer, for example v2026.8.27.
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing CalVer tag to build (e.g. v2026.8.27)"
        required: true
        type: string

permissions:
  contents: read

env:
  RUST_VERSION: "1.98.0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    # GitHub hides ruleset bypass actors without Administration write access.
    # Keep that powerful readback token in this separately approved environment;
    # the workflow uses it only for GET and never mutates repository settings.
    environment: release-ruleset-audit
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      is_alpha: ${{ steps.tag.outputs.is_alpha }}
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error title=Invalid release tag::$RELEASE_TAG is not a supported version tag."
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            PRERELEASE="${RELEASE_TAG#*-}"
            IFS='.' read -r -a PRERELEASE_PARTS <<<"$PRERELEASE"
            for part in "${PRERELEASE_PARTS[@]}"; do
              if [[ "$part" =~ ^0[0-9]+$ ]]; then
                echo "::error title=Invalid release tag::Numeric prerelease identifiers cannot have leading zeroes: $RELEASE_TAG"
                exit 1
              fi
            done
          fi
          echo "tag=$RELEASE_TAG" >>"$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" =~ -alpha\.[1-9][0-9]*$ ]]; then
            echo "is_alpha=true" >>"$GITHUB_OUTPUT"
          else
            echo "is_alpha=false" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', steps.tag.outputs.tag) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin release source
        id: source
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$SHA" != "$TAG_SHA" ]]; then
            echo "::error title=Release tag moved::Checkout $SHA does not match tag commit $TAG_SHA."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            EVENT_COMMIT="$(git rev-parse "$EVENT_SHA^{commit}")"
            if [[ "$EVENT_COMMIT" != "$TAG_SHA" ]]; then
              echo "::error title=Release tag moved::The push event named $EVENT_COMMIT, but $RELEASE_TAG now resolves to $TAG_SHA."
              exit 1
            fi
          fi
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"

      - name: Require immutable release-tag ruleset
        env:
          RULESET_ID: ${{ vars.RELEASE_TAG_RULESET_ID }}
          RULESET_TOKEN: ${{ secrets.RELEASE_RULESET_TOKEN }}
          IS_ALPHA: ${{ steps.tag.outputs.is_alpha }}
        run: |
          set -euo pipefail
          if [[ -z "$RULESET_ID" && -z "$RULESET_TOKEN" && "$IS_ALPHA" == "true" ]]; then
            echo "::warning title=Alpha tag ruleset audit skipped::No immutable-tag audit credentials are configured. This alpha remains pinned to the push SHA and its remote tag is revalidated immediately before publication; stable releases still fail closed."
            exit 0
          fi
          if [[ ! "$RULESET_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Release tag ruleset missing::Set repository variable RELEASE_TAG_RULESET_ID to an active tag ruleset that forbids updates/deletions of refs/tags/v* with no bypass actors."
            exit 1
          fi
          if [[ -z "$RULESET_TOKEN" ]]; then
            echo "::error title=Release ruleset token missing::The release-ruleset-audit environment secret RELEASE_RULESET_TOKEN needs Administration write permission because GitHub hides bypass actors from read-level callers. This workflow uses it only for GET."
            exit 1
          fi
          RULESET="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $RULESET_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/rulesets/$RULESET_ID"
          )"
          jq -e '
            .target == "tag" and
            .enforcement == "active" and
            has("bypass_actors") and
            (.bypass_actors | length) == 0 and
            (.conditions.ref_name.include | index("refs/tags/v*")) != null and
            (.conditions.ref_name.exclude | length) == 0 and
            ([.rules[].type] | index("update")) != null and
            ([.rules[].type] | index("deletion")) != null
          ' <<<"$RULESET" >/dev/null || {
            echo "::error title=Release tags are mutable::Ruleset $RULESET_ID must actively block updates and deletion of refs/tags/v* without bypass actors."
            exit 1
          }

  # ---------------------------------------------------------------------------
  # Build one release artefact per platform.
  # ---------------------------------------------------------------------------
  build:
    name: Build — ${{ matrix.name }}
    needs: resolve
    # Configure this environment with a required reviewer before adding signing
    # secrets. No unapproved job can then reach private release identities.
    environment: release-signing
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Publish nothing rather than a partial set: if Windows fails we still
      # want to see whether macOS and Linux succeeded, so the draft can be
      # assembled once the cause is fixed.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (universal)
            slug: macos-universal
            # The release surface is a conventional drag-to-Applications disk
            # image. tools/make-dmg.sh verifies the app's signature after mounting
            # the image and never launches it.
            archive: dmg
          - os: ubuntu-latest
            name: Linux (x86_64)
            slug: linux-x86_64
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            name: Windows (x86_64)
            slug: windows-x86_64
            target: x86_64-pc-windows-msvc
            archive: zip
          # An arm64 Linux runner (`ubuntu-24.04-arm`) is available to public
          # repositories. Adding a `linux-aarch64` entry here is all it takes,
          # once somebody can actually test the result — see docs/platforms.md
          # on the difference between "it builds" and "it works".

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          # macOS builds both architectures and lipos them together; the others
          # build for the host only.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: tools/ci-linux-deps.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.slug }}

      - name: Determine version
        id: version
        env:
          RELEASE_REF: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # The tag the `resolve` job pinned, not the raw event input: the
          # pinned value is the one whose commit and ruleset were verified.
          REF="$RELEASE_REF"
          # The tag has a conventional leading v; the app and filenames do not.
          VERSION="${REF#v}"
          CALVER_PATTERN='^[0-9]{4}\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $CALVER_PATTERN ]]; then
            echo "::error title=Invalid release tag::$REF is not Scrozz CalVer. Expected vYYYY.M.D or a validated prerelease such as v2026.8.27-rc.1."
            exit 1
          fi

          # The tag names the release; the workspace names the binary. They are
          # allowed to differ — the app version is CalVer and the crate version
          # is semantic — but the workspace version has to be readable and
          # single-valued, because packaging falls back to it and a release that
          # silently packaged a second `scrozz` package would be unexplainable.
          CARGO_METADATA="$(
            cargo metadata --locked --no-deps --format-version 1
          )"
          WORKSPACE_VERSION_COUNT="$(
            jq '[.packages[] | select(.name == "scrozz")] | length' \
              <<<"$CARGO_METADATA"
          )"
          if [[ "$WORKSPACE_VERSION_COUNT" -ne 1 ]]; then
            echo "::error title=Workspace version unavailable::Expected exactly one scrozz package in Cargo workspace metadata."
            exit 1
          fi
          CARGO_VERSION="$(
            jq -r '.packages[] | select(.name == "scrozz") | .version' \
              <<<"$CARGO_METADATA"
          )"
          if [[ -n "${SCROZZ_REQUIRE_CARGO_VERSION_MATCH:-}" &&
                "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error title=Release version mismatch::Tag $REF names $VERSION, but the Cargo workspace package version is $CARGO_VERSION."
            exit 1
          fi
          echo "cargo_version=$CARGO_VERSION" >>"$GITHUB_OUTPUT"
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"
          echo "Building version $VERSION from $REF"

      - name: Select monotonic MSIX version
        if: matrix.os == 'windows-latest'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid release version::$VERSION is not a supported semantic version."
            exit 1
          fi
          SEMVER_MAJOR="${BASH_REMATCH[1]}"
          SEMVER_MINOR="${BASH_REMATCH[2]}"
          SEMVER_PATCH="${BASH_REMATCH[3]}"
          if (( SEMVER_MAJOR > 65534 ||
                SEMVER_MINOR > 255 ||
                SEMVER_PATCH > 255 )); then
            echo "::error title=MSIX version overflow::MSIX mapping requires semantic major <= 65534 and minor/patch <= 255."
            exit 1
          fi
          NATIVE_MAJOR=$((SEMVER_MAJOR + 1))
          NATIVE_MINOR=$((SEMVER_MINOR * 256 + SEMVER_PATCH))

          # Store versions require a nonzero first component and a zero fourth
          # component. The semantic minor/patch pair is packed into component
          # two; component three orders prereleases below the stable release.
          if [[ "$VERSION" == *-* ]]; then
            NATIVE_BUILD="$GITHUB_RUN_NUMBER"
            if (( NATIVE_BUILD < 1 || NATIVE_BUILD > 65534 )); then
              echo "::error title=MSIX build exhausted::GitHub run number $NATIVE_BUILD is outside the reserved prerelease range 1..65534."
              exit 1
            fi
          else
            NATIVE_BUILD=65535
          fi
          MSIX_VERSION="${NATIVE_MAJOR}.${NATIVE_MINOR}.${NATIVE_BUILD}.0"
          echo "SCROZZ_MSIX_VERSION=$MSIX_VERSION" >>"$GITHUB_ENV"
          echo "MSIX package version: $MSIX_VERSION"

      # --- Compile ------------------------------------------------------------
      - name: Build (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          # Two builds and a lipo, rather than one build, because a universal
          # binary is the only kind that runs natively on both Apple Silicon
          # and the Intel Macs still in use.
          SCROZZ_VERSION="${{ steps.version.outputs.version }}" \
          SCROZZ_BUILD_NUMBER="${{ steps.version.outputs.build_number }}" \
            cargo build --release --locked --features cloud --target aarch64-apple-darwin --bin scrozz
          SCROZZ_VERSION="${{ steps.version.outputs.version }}" \
          SCROZZ_BUILD_NUMBER="${{ steps.version.outputs.build_number }}" \
            cargo build --release --locked --features cloud --target x86_64-apple-darwin --bin scrozz
          mkdir -p dist
          UNIVERSAL_BINARY="$PWD/dist/scrozz"
          lipo -create -output "$UNIVERSAL_BINARY" \
            target/aarch64-apple-darwin/release/scrozz \
            target/x86_64-apple-darwin/release/scrozz
          lipo -info "$UNIVERSAL_BINARY"

          BASE_VERSION="${{ steps.version.outputs.version }}"
          BASE_VERSION="${BASE_VERSION%%-*}"
          SCROZZ_PREBUILT_BIN="$UNIVERSAL_BINARY" \
            SCROZZ_APP_VERSION="$BASE_VERSION" \
            SCROZZ_BUILD_NUMBER="${{ steps.version.outputs.build_number }}" \
            SCROZZ_SIGNING_MODE=external-release \
            SCROZZ_ALLOW_EXTERNAL_SIGNING=1 \
            tools/make-app-bundle.sh "$PWD/dist/Scrozz.app"
          rm -f "$UNIVERSAL_BINARY"
          "dist/Scrozz.app/Contents/MacOS/Scrozz" --version
          lipo -info dist/Scrozz.app/Contents/MacOS/Scrozz

      - name: Build (single target)
        if: matrix.os != 'macos-latest'
        run: |
          SCROZZ_VERSION="${{ steps.version.outputs.version }}" \
          SCROZZ_BUILD_NUMBER="${{ steps.version.outputs.build_number }}" \
            cargo build --release --locked --features cloud --target "${{ matrix.target }}" --bin scrozz
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/scrozz.exe" dist/
          else
            cp "target/${{ matrix.target }}/release/scrozz" dist/
          fi

      - name: Smoke typed missing-file share boundary
        run: |
          set -euo pipefail
          BIN="dist/scrozz"
          [[ "${{ runner.os }}" == "Windows" ]] && BIN="dist/scrozz.exe"
          MISSING="$RUNNER_TEMP/scrozz-missing-share.png"
          rm -f "$MISSING"
          unset SCROZZ_S3_ACCESS_KEY_ID SCROZZ_S3_SECRET_ACCESS_KEY \
            SCROZZ_S3_SESSION_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
            AWS_SESSION_TOKEN
          set +e
          OUTPUT="$("$BIN" --json --no-ipc share "$MISSING" 2>&1)"
          STATUS=$?
          set -e
          if [[ "$STATUS" != "2" ]] ||
             ! grep -q '"kind":"usage"' <<<"$OUTPUT" ||
             grep -qi -E 'Unsupported|--features cloud' <<<"$OUTPUT"; then
            echo "::error title=Share boundary smoke failed::Expected a typed usage error for the missing file."
            printf '%s\n' "$OUTPUT"
            exit 1
          fi
      - name: Acquire pinned Windows Tesseract payload
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ManifestPath = Join-Path `
            $env:GITHUB_WORKSPACE "packaging\windows\tesseract-payload.json"
          $Manifest = Get-Content -LiteralPath $ManifestPath -Raw |
            ConvertFrom-Json
          if ($Manifest.schema -ne 1) {
            throw "Unsupported Tesseract payload manifest schema"
          }

          function Assert-Sha256 {
            param([string] $Path, [string] $Expected)
            $Actual = (
              Get-FileHash -LiteralPath $Path -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            if ($Actual -ne $Expected.ToLowerInvariant()) {
              throw "SHA-256 mismatch for ${Path}: expected $Expected, found $Actual"
            }
          }

          $Package = $Manifest.chocolatey_package
          $PackageId = [string] $Package.id
          $PackageVersion = [string] $Package.version
          $DownloadRoot = Join-Path $env:RUNNER_TEMP "scrozz-tesseract"
          Remove-Item -LiteralPath $DownloadRoot -Recurse -Force `
            -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $DownloadRoot | Out-Null
          $Nupkg = Join-Path `
            $DownloadRoot "$PackageId.$PackageVersion.nupkg"
          Invoke-WebRequest -Uri $Package.url -OutFile $Nupkg
          Assert-Sha256 $Nupkg $Package.sha256

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $Archive = [IO.Compression.ZipFile]::OpenRead($Nupkg)
          try {
            $InstallerEntry = $Archive.GetEntry($Package.installer_path)
            if ($null -eq $InstallerEntry) {
              throw "Verified nupkg is missing $($Package.installer_path)"
            }
            $Stream = $InstallerEntry.Open()
            $Hasher = [Security.Cryptography.SHA256]::Create()
            try {
              $InstallerHash = [BitConverter]::ToString(
                $Hasher.ComputeHash($Stream)
              ).Replace("-", "").ToLowerInvariant()
            } finally {
              $Hasher.Dispose()
              $Stream.Dispose()
            }
            if ($InstallerHash -ne $Package.installer_sha256) {
              throw "Embedded Tesseract installer checksum mismatch"
            }
          } finally {
            $Archive.Dispose()
          }

          # This local-only source plus ignored dependencies prevents Chocolatey
          # from resolving any mutable package during release acquisition.
          choco.exe install $PackageId `
            "--version=$PackageVersion" `
            "--source=$DownloadRoot" `
            --yes `
            --no-progress `
            --require-checksums `
            --ignore-dependencies `
            --allow-downgrade `
            --force
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey failed to install the verified local Tesseract package"
          }

          $Tesseract = Join-Path $env:ProgramFiles "Tesseract-OCR"
          $Tessdata = Join-Path $Tesseract "tessdata"
          New-Item -ItemType Directory -Path $Tessdata -Force | Out-Null
          $Model = $Manifest.language_model
          $DownloadedModel = Join-Path $DownloadRoot $Model.name
          Invoke-WebRequest -Uri $Model.url -OutFile $DownloadedModel
          Assert-Sha256 $DownloadedModel $Model.sha256
          Move-Item `
            -LiteralPath $DownloadedModel `
            -Destination (Join-Path $Tessdata $Model.name) `
            -Force

          $ExpectedDlls = @()
          foreach ($PayloadFile in @($Manifest.payload_files)) {
            $RelativePath = [string] $PayloadFile.path
            $NativePath = $RelativePath.Replace(
              "/", [IO.Path]::DirectorySeparatorChar
            )
            $InstalledPath = Join-Path $Tesseract $NativePath
            if (-not (Test-Path -LiteralPath $InstalledPath -PathType Leaf)) {
              throw "Verified Tesseract payload is missing $RelativePath"
            }
            Assert-Sha256 $InstalledPath $PayloadFile.sha256
            if ($RelativePath -match "^[0-9A-Za-z.+_-]+\.dll$") {
              $ExpectedDlls += $RelativePath
            }
          }
          $ExpectedDlls = @($ExpectedDlls | Sort-Object)
          $ActualDlls = @(
            Get-ChildItem -LiteralPath $Tesseract -Filter "*.dll" -File |
              ForEach-Object { $_.Name } |
              Sort-Object
          )
          $DllDifference = @(
            Compare-Object `
              -ReferenceObject $ExpectedDlls `
              -DifferenceObject $ActualDlls
          )
          if ($DllDifference.Count -ne 0) {
            throw "Installed Tesseract runtime DLL closure differs from the manifest"
          }

          $TesseractExecutable = Join-Path $Tesseract "tesseract.exe"
          $Languages = @(
            & $TesseractExecutable `
              --tessdata-dir $Tessdata `
              --list-langs 2>&1
          )
          if ($LASTEXITCODE -ne 0 -or $Languages -notcontains "eng") {
            throw "Verified Tesseract payload cannot load the pinned English model"
          }

          "SCROZZ_TESSERACT_DIR=$Tesseract" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # --- macOS signing and notarisation (skipped unless secrets exist) ------
      #
      # Requires, all as repository secrets:
      #   MACOS_CERTIFICATE_P12       base64 of a Developer ID Application .p12
      #   MACOS_CERTIFICATE_PASSWORD  its export password
      #   MACOS_SIGN_IDENTITY         e.g. "Developer ID Application: Name (TEAMID)"
      #   MACOS_NOTARY_KEY            base64 of an App Store Connect .p8 API key
      #   MACOS_NOTARY_KEY_ID         that key's ID
      #   MACOS_NOTARY_ISSUER_ID      the issuer UUID
      - name: Sign and notarise macOS app (when configured)
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$MACOS_CERTIFICATE_P12" ]]; then
            echo "::notice title=macOS app is unsigned::No MACOS_CERTIFICATE_P12 secret is set, so signing and notarisation were skipped. Gatekeeper will block this app on other people's machines until a Developer ID certificate is configured."
            exit 0
          fi
          : "${MACOS_SIGN_IDENTITY:?MACOS_SIGN_IDENTITY is required}"
          : "${MACOS_NOTARY_KEY:?MACOS_NOTARY_KEY is required}"
          : "${MACOS_NOTARY_KEY_ID:?MACOS_NOTARY_KEY_ID is required}"
          : "${MACOS_NOTARY_ISSUER_ID:?MACOS_NOTARY_ISSUER_ID is required}"

          # A throwaway keychain, so the certificate never touches the login
          # keychain and dies with the runner.
          KEYCHAIN="$RUNNER_TEMP/scrozz-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/scrozz-signing.p12"
          NOTARY_KEY="$RUNNER_TEMP/scrozz-notary.p8"
          NOTARY_ARCHIVE="$RUNNER_TEMP/scrozz-notarize.zip"
          cleanup_signing_material() {
            rm -f "$CERTIFICATE" "$NOTARY_KEY" "$NOTARY_ARCHIVE"
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
          }
          trap cleanup_signing_material EXIT

          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode >"$CERTIFICATE"
          security import "$CERTIFICATE" \
            -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # --options runtime is the hardened runtime; notarisation rejects
          # anything without it. --timestamp is likewise mandatory.
          #
          # No --deep: Apple deprecated it, and it is the wrong tool anyway.
          # The correct order is nested code first, then the bundle. Scrozz.app
          # has no nested code — one executable, some resources — so signing the
          # bundle once is complete. If a helper or framework is ever added it
          # must be signed here before this line, not by reaching for --deep.
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" dist/Scrozz.app
          codesign --verify --strict --verbose=2 dist/Scrozz.app

          # Notarisation needs a container. ditto -c -k --keepParent is the
          # supported way to hand a bundle to notarytool.
          echo "$MACOS_NOTARY_KEY" | base64 --decode >"$NOTARY_KEY"
          ditto -c -k --keepParent dist/Scrozz.app "$NOTARY_ARCHIVE"
          xcrun notarytool submit "$NOTARY_ARCHIVE" \
            --key "$NOTARY_KEY" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
          rm -f "$NOTARY_KEY"

          # Stapling attaches the notarisation ticket to the bundle itself, so
          # first launch works on a machine that is offline or behind a network
          # that blocks Apple's OCSP. This step is only possible because the
          # artefact is a bundle; `stapler` refuses bare executables, which is
          # why the previous shape of this workflow could not do it.
          xcrun stapler staple dist/Scrozz.app
          xcrun stapler validate dist/Scrozz.app

          # The end-to-end assertion: would Gatekeeper actually let a stranger
          # open this? Failing here is worth failing the release for.
          spctl --assess --type exec --verbose=4 dist/Scrozz.app
          echo "SCROZZ_MACOS_PAYLOAD_SIGNED=1" >>"$GITHUB_ENV"
          echo "SCROZZ_MACOS_NOTARIZED=1" >>"$GITHUB_ENV"

      - name: Note unsigned macOS build
        if: matrix.os == 'macos-latest' && env.SCROZZ_MACOS_PAYLOAD_SIGNED != '1'
        run: |
          set -euo pipefail
          # The bundle was assembled with SCROZZ_SKIP_SIGN because a real
          # identity was expected. There is none, so give it the development
          # signature instead — an unsigned bundle is worse than an ad-hoc one:
          # macOS has nothing at all to hang a TCC grant on, so the app cannot
          # be granted Screen Recording even by the person who downloaded it.
          codesign --force --sign - --identifier com.thatcube.Scrozz dist/Scrozz.app
          codesign --verify --strict dist/Scrozz.app
          echo "::notice title=macOS app is ad-hoc signed only::No MACOS_CERTIFICATE_P12 secret is set, so Developer ID signing and notarisation were skipped and Scrozz.app carries a development (ad-hoc) signature. Gatekeeper will block it on other people's machines, and because an ad-hoc identity is effectively the cdhash, a Screen Recording grant will not survive a rebuild. Configure the signing secrets for a release anyone else can install."

      # --- Windows signing ----------------------------------------------------
      #
      # Requires, as repository secrets:
      #   WINDOWS_CERTIFICATE_PFX       base64 of a code-signing .pfx
      #   WINDOWS_CERTIFICATE_PASSWORD  its password
      #
      # A cheaper, keyless alternative worth considering before buying an EV
      # certificate is Azure Trusted Signing, which swaps these two secrets for
      # an Azure identity and a different action.
      - name: Sign Windows executable
        if: matrix.os == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          IS_ALPHA: ${{ needs.resolve.outputs.is_alpha }}
        run: |
          set -euo pipefail
          if [[ -z "$WINDOWS_CERTIFICATE_PFX" ]]; then
            if [[ "$IS_ALPHA" == "true" ]]; then
              echo "::warning title=Unsigned Windows alpha::The alpha release will contain only an unsigned portable ZIP because no Windows signing certificate is configured."
              exit 0
            fi
            echo "::error title=Windows signing identity is required::Release packaging fails closed instead of publishing a weaker unsigned executable."
            exit 1
          fi
          PFX="$RUNNER_TEMP/scrozz-executable-signing.pfx"
          trap 'rm -f "$PFX"' EXIT
          echo "$WINDOWS_CERTIFICATE_PFX" | base64 --decode >"$PFX"

          # signtool lives in the Windows SDK, whose directory is versioned.
          # Find the newest rather than hard-coding a version that a runner
          # image update will silently remove.
          SIGNTOOL="$(find '/c/Program Files (x86)/Windows Kits/10/bin' \
            -name 'signtool.exe' -path '*x64*' 2>/dev/null | sort | tail -n 1)"
          if [[ -z "$SIGNTOOL" ]]; then
            echo "::error title=signtool not found::The Windows SDK layout on this runner image changed. Look under '/c/Program Files (x86)/Windows Kits/10/bin' (the Git-bash spelling of C:\\Program Files...) and update the find in this step."
            exit 1
          fi

          "$SIGNTOOL" sign \
            /f "$PFX" \
            /p "$WINDOWS_CERTIFICATE_PASSWORD" \
            /fd SHA256 \
            /tr http://timestamp.digicert.com \
            /td SHA256 \
            dist/scrozz.exe
          "$SIGNTOOL" verify /pa dist/scrozz.exe

      # --- Package ------------------------------------------------------------
      #
      # Capture is gated per platform, and a build from a gated platform runs
      # but cannot take a screenshot. Publishing that under the same name as a
      # working build is the one thing in this pipeline that could actually
      # mislead somebody, so it is labelled — and the label is probed from the
      # binary by tools/preview-check.sh rather than hardcoded here, so it stops
      # applying by itself on the day a platform's gate opens.
      - name: Label preview builds
        id: preview
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            macOS)   PROBE="dist/Scrozz.app/Contents/MacOS/Scrozz" ;;
            Windows) PROBE="dist/scrozz.exe" ;;
            *)       PROBE="dist/scrozz" ;;
          esac
          PREVIEW="$(tools/preview-check.sh probe "$PROBE")"
          echo "preview=$PREVIEW" >>"$GITHUB_OUTPUT"
          if [[ "$PREVIEW" == "1" ]]; then
            SCROZZ_VERSION="${{ steps.version.outputs.version }}" \
            SCROZZ_STAMP="${{ inputs.tag || github.ref_name }}" \
            SCROZZ_PLATFORM="${{ matrix.slug }}" \
              tools/preview-check.sh notice dist
            echo "::warning title=${{ matrix.name }} is a preview build::Capture is gated off on this platform, so this artefact runs but cannot take a screenshot. It is named -preview and ships a PREVIEW.txt saying so."
          else
            echo "Capture gate is open on ${{ matrix.slug }}; not a preview."
          fi

      - name: Package
        if: matrix.os != 'windows-latest'
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          NAME="scrozz-${VERSION}-${{ matrix.slug }}"
          if [[ "${{ steps.preview.outputs.preview }}" == "1" ]]; then
            NAME="${NAME}-preview"
          fi

          # GPL-3.0 obliges us to ship the licence with the binary (D2), and
          # the trademark terms travel with it.
          cp LICENSE TRADEMARK.md README.md dist/

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ASSET="${NAME}.dmg"
            tools/make-dmg.sh dist/Scrozz.app "$ASSET"
          elif [[ "${{ matrix.archive }}" == "zip" ]]; then
            cd dist
            7z a "../${NAME}.zip" ./* >/dev/null
            ASSET="${NAME}.zip"
            cd ..
          else
            cd dist
            tar -czf "../${NAME}.tar.gz" ./*
            ASSET="${NAME}.tar.gz"
            cd ..
          fi

          # Checksum per artefact now; the release job concatenates them into a
          # single SHA256SUMS file people can actually verify against.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" >"${ASSET}.sha256"
          else
            shasum -a 256 "$ASSET" >"${ASSET}.sha256"
          fi

          PACKAGE_KIND=portable-archive
          PAYLOAD_SIGNED=false
          NOTARIZED=false
          PACKAGE_IDENTITY=""
          NATIVE_PACKAGE_VERSION="$VERSION"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            PACKAGE_KIND=disk-image
            PACKAGE_IDENTITY=com.thatcube.Scrozz
            NATIVE_PACKAGE_VERSION="${VERSION%%-*}"
            if [[ "${SCROZZ_MACOS_PAYLOAD_SIGNED:-0}" == "1" ]]; then
              PAYLOAD_SIGNED=true
            fi
            if [[ "${SCROZZ_MACOS_NOTARIZED:-0}" == "1" ]]; then
              NOTARIZED=true
            fi
          fi
          python3 - \
            "$ASSET" \
            "$VERSION" \
            "$NATIVE_PACKAGE_VERSION" \
            "${{ matrix.slug }}" \
            "$PACKAGE_KIND" \
            "$PACKAGE_IDENTITY" \
            "$PAYLOAD_SIGNED" \
            "$NOTARIZED" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          asset = pathlib.Path(sys.argv[1])
          metadata = {
              "schema": 1,
              "platform": sys.argv[4],
              "version": sys.argv[2],
              "file": asset.name,
              "sha256": hashlib.sha256(asset.read_bytes()).hexdigest(),
              "size": asset.stat().st_size,
              "package_kind": sys.argv[5],
              "native_package_version": sys.argv[3],
              "package_identity": sys.argv[6],
              "signed": False,
              "payload_signed": sys.argv[7] == "true",
              "notarized": sys.argv[8] == "true",
              "signed_manifest": False,
          }
          pathlib.Path(f"{asset}.artifact.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          cat "${ASSET}.sha256"
          echo "asset=$ASSET" >>"$GITHUB_OUTPUT"

      - name: Package portable ZIP and MSIX
        if: matrix.os == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_MSIX_IDENTITY_NAME: ${{ secrets.WINDOWS_MSIX_IDENTITY_NAME }}
          WINDOWS_MSIX_PUBLISHER: ${{ secrets.WINDOWS_MSIX_PUBLISHER }}
          WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME }}
          IS_ALPHA: ${{ needs.resolve.outputs.is_alpha }}
        run: |
          set -euo pipefail
          CONFIGURED=0
          for value in \
            "$WINDOWS_CERTIFICATE_PFX" \
            "$WINDOWS_MSIX_IDENTITY_NAME" \
            "$WINDOWS_MSIX_PUBLISHER" \
            "$WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME"; do
            [[ -n "$value" ]] && CONFIGURED=$((CONFIGURED + 1))
          done
          if ((CONFIGURED == 0)) && [[ "$IS_ALPHA" == "true" ]]; then
            export SCROZZ_WINDOWS_VERIFY_DETERMINISM=1
            export SCROZZ_MSIX_IDENTITY_MODE=development
            powershell.exe -NoLogo -NoProfile -NonInteractive \
              -ExecutionPolicy Bypass \
              -File tools/package-windows.ps1 \
              -OutputDirectory release-artifacts \
              -Binary dist/scrozz.exe \
              -Version "${{ steps.version.outputs.version }}" \
              -Stamp alpha \
              -Architecture x86_64
            rm -f release-artifacts/*.msix \
              release-artifacts/*.msix.sha256 \
              release-artifacts/*.msix.artifact.json
            exit 0
          fi
          if ((CONFIGURED != 4)); then
            echo "::error title=Partial Windows signing configuration::Configure all Windows certificate and Store identity secrets, or leave all of them empty for an unsigned portable alpha ZIP."
            exit 1
          fi

          export SCROZZ_WINDOWS_VERIFY_DETERMINISM=1
          export SCROZZ_MSIX_IDENTITY_MODE=store
          export SCROZZ_MSIX_IDENTITY_NAME="$WINDOWS_MSIX_IDENTITY_NAME"
          export SCROZZ_MSIX_PUBLISHER="$WINDOWS_MSIX_PUBLISHER"
          export SCROZZ_MSIX_PUBLISHER_DISPLAY_NAME="$WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME"

          PFX="$RUNNER_TEMP/scrozz-msix-signing.pfx"
          trap 'rm -f "$PFX"' EXIT
          echo "$WINDOWS_CERTIFICATE_PFX" | base64 --decode >"$PFX"
          export SCROZZ_MSIX_SIGN_PFX="$PFX"
          export SCROZZ_MSIX_SIGN_PFX_PASSWORD="$WINDOWS_CERTIFICATE_PASSWORD"

          powershell.exe -NoLogo -NoProfile -NonInteractive \
            -ExecutionPolicy Bypass \
            -File tools/package-windows.ps1 \
            -OutputDirectory release-artifacts \
            -Binary dist/scrozz.exe \
            -Version "${{ steps.version.outputs.version }}" \
            -Stamp release \
            -Architecture x86_64

      - name: Upload artefact
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
            ${{ steps.package.outputs.asset }}.artifact.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Assemble checksums, publish alpha prereleases, or open a stable draft.
  # ---------------------------------------------------------------------------
  checksums-and-draft:
    name: Publish alpha or draft release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The one job that needs write access, and only for creating the release.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          # One file, sorted, in the format `sha256sum -c` expects.
          cat ./*.sha256 | sort -k2 >SHA256SUMS
          rm -f ./*.sha256
          {
            echo "### Artefacts"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Optional detached signature over the checksum file — the customary way
      # to make a Linux release verifiable without any platform certificate.
      # Requires secrets GPG_PRIVATE_KEY (ASCII-armoured) and GPG_PASSPHRASE.
      - name: Sign SHA256SUMS (when configured)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::notice title=Checksums are unsigned::No GPG_PRIVATE_KEY secret is set, so the detached checksum signature was skipped."
            exit 0
          fi
          GNUPGHOME="$RUNNER_TEMP/scrozz-release-gnupg"
          rm -rf "$GNUPGHOME"
          mkdir -m 700 "$GNUPGHOME"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd artifacts
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor SHA256SUMS

      - name: Verify artifact metadata and checksums
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          import pathlib

          root = pathlib.Path("artifacts")
          metadata_paths = sorted(root.glob("*.artifact.json"))
          if not metadata_paths:
              raise SystemExit("release artifacts have no signing metadata")
          for metadata_path in metadata_paths:
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              artifact = root / metadata["file"]
              if not artifact.is_file():
                  raise SystemExit(f"metadata references missing artifact: {artifact}")
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              if digest != metadata["sha256"]:
                  raise SystemExit(f"metadata checksum mismatch: {artifact}")
          PY
          (cd artifacts && sha256sum -c SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PINNED_SHA: ${{ needs.resolve.outputs.sha }}
          IS_ALPHA: ${{ needs.resolve.outputs.is_alpha }}
        run: |
          set -euo pipefail

          REMOTE_TAGS="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          REMOTE_SHA="$(
            awk '$2 ~ /\^\{\}$/ { print $1; found=1 } END { if (!found) exit 1 }' \
              <<<"$REMOTE_TAGS" 2>/dev/null ||
            awk '$2 !~ /\^\{\}$/ { print $1; exit }' <<<"$REMOTE_TAGS"
          )"
          if [[ -z "$REMOTE_SHA" || "$REMOTE_SHA" != "$PINNED_SHA" ]]; then
            echo "::error title=Release tag moved::$TAG now resolves to ${REMOTE_SHA:-nothing}, not the reviewed source $PINNED_SHA."
            exit 1
          fi

          # --verify-tag refuses to invent a tag that does not exist, which
          # turns a typo in workflow_dispatch into an error rather than a
          # release built from the wrong commit.
          VERSION="${TAG#v}"
          FLAGS=(
            --verify-tag
            --title "Scrozz $VERSION"
            --generate-notes
          )
          if [[ "$IS_ALPHA" == "true" ]]; then
            FLAGS+=(
              --prerelease
              --latest=false
              --notes "⚠️ **Alpha software:** expect defects and breaking changes. Back up important captures and report reproducible problems."
            )
          else
            FLAGS+=(--draft)
          fi
          gh release create "$TAG" "${FLAGS[@]}" artifacts/*

          if [[ "$IS_ALPHA" == "true" ]]; then
            echo "::notice title=Alpha prerelease published::$TAG is public, downloadable, marked prerelease, and excluded from Latest."
          else
            echo "::notice title=Draft release created::Review it, then publish by hand. Nothing has been made public."
          fi

      - name: Summarise what is and is not signed
        # Only the presence of each secret reaches the shell, and only through
        # the environment. A secret expression interpolated into the program
        # text itself would be a second place a value could leak from.
        env:
          MACOS_SIGNING_STATUS: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && 'Developer ID, notarised, stapled' || 'ad-hoc only' }}
          WINDOWS_SIGNING_STATUS: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' && 'yes' || 'no' }}
          CHECKSUM_SIGNING_STATUS: ${{ secrets.GPG_PRIVATE_KEY != '' && 'yes' || 'no' }}
        run: |
          {
            echo "### Signing status"
            echo
            echo "| Platform | Signed | Secret that enables it |"
            echo "|---|---|---|"
            echo "| macOS (.dmg containing Scrozz.app) | $MACOS_SIGNING_STATUS | \`MACOS_CERTIFICATE_P12\` (+ password, identity, notary key/ID/issuer) |"
            echo "| Windows | $WINDOWS_SIGNING_STATUS | \`WINDOWS_CERTIFICATE_PFX\` (+ password) |"
            echo "| Checksums (GPG) | $CHECKSUM_SIGNING_STATUS | \`GPG_PRIVATE_KEY\` (+ passphrase) |"
            echo
            echo "Unsigned artefacts work locally, but Gatekeeper and SmartScreen"
            echo "will warn users. On macOS specifically, an ad-hoc signature is a"
            echo "development identity: it is effectively the cdhash, so a Screen"
            echo "Recording grant does not survive a rebuild. Developer ID is what"
            echo "gives a release a stable identity. Configure the secrets above in"
            echo "**Settings → Secrets and variables → Actions** when signing"
            echo "certificates exist. None are required for a draft release."
            echo
            echo "Any artefact named \`-preview\` runs but cannot take a screenshot:"
            echo "its platform's capture gate is still closed. See its PREVIEW.txt."
            echo
            if [[ "${{ needs.resolve.outputs.is_alpha }}" == "true" ]]; then
              echo "This release is a public **alpha prerelease** for voluntary testing."
            else
              echo "This stable release remains a **draft** until maintainer approval."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          # The table above says which secrets were configured. This one says
          # what the artifacts actually are, read back from the metadata each
          # packaging run emitted, with every checksum re-verified here so the
          # summary cannot describe a file that is not the file attached.
          python3 <<'PY' >>"$GITHUB_STEP_SUMMARY"
          import hashlib
          import json
          import pathlib

          root = pathlib.Path("artifacts")
          metadata_paths = sorted(root.glob("*.artifact.json"))
          if not metadata_paths:
              raise SystemExit("release artifacts have no signing metadata")

          def yes_no(value):
              return "yes" if value else "no"

          print()
          print("### Artifact metadata")
          print()
          print("| Artifact | Package | Container signed | Payload signed | Notarized/stapled |")
          print("|---|---|---:|---:|---:|")
          for metadata_path in metadata_paths:
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              artifact = root / metadata["file"]
              if not artifact.is_file():
                  raise SystemExit(f"metadata references missing artifact: {artifact}")
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              if digest != metadata["sha256"]:
                  raise SystemExit(f"metadata checksum mismatch: {artifact}")

              notarized = (
                  yes_no(metadata["notarized"])
                  if "notarized" in metadata
                  else "n/a"
              )
              print(
                  f"| `{metadata['file']}` "
                  f"| {metadata['package_kind']} "
                  f"| {yes_no(metadata['signed'])} "
                  f"| {yes_no(metadata['payload_signed'])} "
                  f"| {notarized} |"
              )

          print()
          print(
              f"Detached GPG signature for `SHA256SUMS`: "
              f"**{yes_no((root / 'SHA256SUMS.asc').is_file())}**."
          )
          print()
          print(
              "Windows executable and MSIX package signatures are reported "
              "separately from artifact metadata. A PFX enables executable "
              "signing; MSIX signing additionally requires Store identity and "
              "publisher values."
          )
          PY
