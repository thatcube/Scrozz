# Signed native release artifacts. The release-signing environment is expected
# to require a human reviewer and owns every production signing credential.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RUST_VERSION: "1.98.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      bundle_version: ${{ steps.release.outputs.bundle_version }}
      stamp: ${{ steps.release.outputs.stamp }}
      tag_preview: ${{ steps.release.outputs.tag_preview }}
    steps:
      - uses: actions/checkout@v4

      - name: Match tag to the workspace version
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid release tag::$GITHUB_REF_NAME is not a supported semantic version."
            exit 1
          fi

          package_version="$(
            sed -n 's/^version = "\(.*\)"/\1/p' apps/scrozz/Cargo.toml | head -1
          )"
          if [[ "$version" != "$package_version" ]]; then
            echo "::error title=Version mismatch::Tag $version does not match scrozz $package_version."
            exit 1
          fi

          tag_preview=false
          [[ "$version" == *-* ]] && tag_preview=true
          {
            echo "version=$version"
            echo "bundle_version=${version%%-*}"
            echo "stamp=${GITHUB_SHA:0:12}"
            echo "tag_preview=$tag_preview"
          } >>"$GITHUB_OUTPUT"

  macos:
    name: macOS signed and notarized app
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release-signing
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos

      - name: Import Developer ID and notarization credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGN_IDENTITY \
            NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing release credential::$name is not configured in release-signing."
              exit 1
            fi
          done

          certificate="$RUNNER_TEMP/scrozz-developer-id.p12"
          notary_key="$RUNNER_TEMP/scrozz-notary-key.p8"
          keychain="$RUNNER_TEMP/scrozz-release.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | openssl base64 -d -A >"$certificate"
          printf '%s' "$NOTARY_KEY_BASE64" | openssl base64 -d -A >"$notary_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"

          {
            echo "SCROZZ_SIGN_IDENTITY=$SIGN_IDENTITY"
            echo "SCROZZ_NOTARY_KEY=$notary_key"
            echo "SCROZZ_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "SCROZZ_NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >>"$GITHUB_ENV"

      - name: Build release executable
        run: cargo build --locked --release -p scrozz

      - name: Smoke release executable
        run: tools/smoke.sh

      - name: Sign app bundle
        env:
          SCROZZ_APP_VERSION: ${{ needs.prepare.outputs.bundle_version }}
          SCROZZ_BUILD_NUMBER: ${{ github.run_number }}
          SCROZZ_PREBUILT_BIN: target/release/scrozz
          SCROZZ_SIGNING_MODE: developer-id-release
        run: tools/make-app-bundle.sh "$RUNNER_TEMP/Scrozz.app"

      - name: Notarize and staple app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Scrozz.app" \
            "$RUNNER_TEMP/Scrozz-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Scrozz-notary.zip" \
            --key "$SCROZZ_NOTARY_KEY" \
            --key-id "$SCROZZ_NOTARY_KEY_ID" \
            --issuer "$SCROZZ_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/Scrozz.app"
          xcrun stapler validate "$RUNNER_TEMP/Scrozz.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Scrozz.app"
          spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/Scrozz.app"

      - name: Package signed app without re-signing
        env:
          SCROZZ_APP_VERSION: ${{ needs.prepare.outputs.version }}
          SCROZZ_STAMP: ${{ needs.prepare.outputs.stamp }}
          SCROZZ_PREBUILT_APP: ${{ runner.temp }}/Scrozz.app
        run: tools/package.sh dist

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.artifact.json
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows signed portable and MSIX
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release-signing
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: Build release executable
        run: cargo build --locked --release -p scrozz

      - name: Prepare pinned portable OCR payload
        shell: pwsh
        env:
          TESSERACT_ARCHIVE_URL: ${{ secrets.WINDOWS_TESSERACT_ARCHIVE_URL }}
          TESSERACT_ARCHIVE_SHA256: ${{ secrets.WINDOWS_TESSERACT_ARCHIVE_SHA256 }}
        run: |
          if ([String]::IsNullOrWhiteSpace($env:TESSERACT_ARCHIVE_URL) -or
              -not $env:TESSERACT_ARCHIVE_URL.StartsWith("https://", [StringComparison]::OrdinalIgnoreCase)) {
            throw "WINDOWS_TESSERACT_ARCHIVE_URL must be configured as an HTTPS URL"
          }
          if ($env:TESSERACT_ARCHIVE_SHA256 -notmatch "^[0-9A-Fa-f]{64}$") {
            throw "WINDOWS_TESSERACT_ARCHIVE_SHA256 must be configured"
          }

          $ArchivePath = Join-Path $env:RUNNER_TEMP "scrozz-tesseract.zip"
          $ExtractRoot = Join-Path $env:RUNNER_TEMP "scrozz-tesseract"
          & curl.exe `
            --fail `
            --silent `
            --show-error `
            --location `
            --proto "=https" `
            --proto-redir "=https" `
            --max-redirs 5 `
            --connect-timeout 15 `
            --max-time 300 `
            --max-filesize 536870912 `
            --output $ArchivePath `
            --url $env:TESSERACT_ARCHIVE_URL
          if ($LASTEXITCODE -ne 0) {
            throw "Portable OCR payload download failed with status $LASTEXITCODE"
          }
          $ActualHash = (Get-FileHash -LiteralPath $ArchivePath -Algorithm SHA256).Hash
          if ($ActualHash -ne $env:TESSERACT_ARCHIVE_SHA256) {
            throw "Portable OCR payload SHA-256 mismatch"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $Archive = [IO.Compression.ZipFile]::OpenRead($ArchivePath)
          try {
            if ($Archive.Entries.Count -gt 4096) {
              throw "Portable OCR payload contains too many archive entries"
            }
            [UInt64] $ExpandedBytes = 0
            $Prefix = [IO.Path]::GetFullPath($ExtractRoot).TrimEnd("\") + "\"
            foreach ($Entry in $Archive.Entries) {
              if ($Entry.FullName.Contains("`r") -or $Entry.FullName.Contains("`n")) {
                throw "Portable OCR payload contains an unsafe entry name"
              }
              $Target = [IO.Path]::GetFullPath((Join-Path $ExtractRoot $Entry.FullName))
              if (-not $Target.StartsWith($Prefix, [StringComparison]::OrdinalIgnoreCase)) {
                throw "Portable OCR payload entry escapes the extraction root"
              }
              $ExpandedBytes += [UInt64] $Entry.Length
              if ($ExpandedBytes -gt 536870912) {
                throw "Portable OCR payload expands beyond 512 MiB"
              }
            }
          } finally {
            $Archive.Dispose()
          }

          Expand-Archive -LiteralPath $ArchivePath -DestinationPath $ExtractRoot
          $ReparsePoints = @(Get-ChildItem -LiteralPath $ExtractRoot -Recurse -Force |
            Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 })
          if ($ReparsePoints.Count -ne 0) {
            throw "Portable OCR payload contains reparse points"
          }
          $Candidates = @(Get-ChildItem -LiteralPath $ExtractRoot -Filter "tesseract.exe" -File -Recurse |
            Where-Object {
              Test-Path -LiteralPath (Join-Path $_.Directory.FullName "tessdata\eng.traineddata") -PathType Leaf
            })
          if ($Candidates.Count -ne 1) {
            throw "Portable OCR payload must contain exactly one Tesseract runtime with eng.traineddata"
          }
          "SCROZZ_TESSERACT_DIR=$($Candidates[0].Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign release executable
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          PACKAGE_PUBLISHER: ${{ secrets.WINDOWS_MSIX_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ secrets.WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          foreach ($Name in @(
            "SIGN_PFX_BASE64",
            "SIGN_PFX_PASSWORD",
            "PACKAGE_PUBLISHER",
            "PUBLISHER_DISPLAY_NAME"
          )) {
            if ([String]::IsNullOrWhiteSpace((Get-Item "Env:$Name").Value)) {
              throw "$Name is not configured in the release-signing environment"
            }
          }

          $Pfx = Join-Path $env:RUNNER_TEMP "scrozz-release.pfx"
          [IO.File]::WriteAllBytes($Pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $SignTool = Get-ChildItem `
            -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter "signtool.exe" `
            -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if ([String]::IsNullOrWhiteSpace($SignTool)) {
            throw "SignTool was not found in the Windows SDK"
          }

          & $SignTool sign `
            /fd SHA256 `
            /f $Pfx `
            /p $env:SIGN_PFX_PASSWORD `
            /tr "http://timestamp.digicert.com" `
            /td SHA256 `
            "target\release\scrozz.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "SignTool failed with status $LASTEXITCODE"
          }
          & $SignTool verify /pa "target\release\scrozz.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "SignTool verification failed with status $LASTEXITCODE"
          }

          @(
            "SCROZZ_SIGNTOOL=$SignTool",
            "SCROZZ_MSIX_SIGN_PFX=$Pfx",
            "SCROZZ_MSIX_IDENTITY_NAME=com.thatcube.Scrozz",
            "SCROZZ_MSIX_PUBLISHER=$env:PACKAGE_PUBLISHER",
            "SCROZZ_MSIX_PUBLISHER_DISPLAY_NAME=$env:PUBLISHER_DISPLAY_NAME",
            "SCROZZ_WINDOWS_BINARY_SIGNED=1"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke signed release executable
        run: tools/smoke.sh

      - name: Package signed Windows artifacts
        env:
          SCROZZ_APP_VERSION: ${{ needs.prepare.outputs.version }}
          SCROZZ_STAMP: ${{ needs.prepare.outputs.stamp }}
          SCROZZ_MSIX_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          SCROZZ_WINDOWS_VERIFY_DETERMINISM: "1"
        run: tools/package.sh dist

      - name: Verify signed MSIX
        shell: pwsh
        run: |
          $Msix = Get-ChildItem -LiteralPath dist -Filter *.msix -File |
            Select-Object -First 1 -ExpandProperty FullName
          & $env:SCROZZ_SIGNTOOL verify /pa $Msix
          if ($LASTEXITCODE -ne 0) {
            throw "SignTool rejected the packaged MSIX"
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.msix
            dist/*.sha256
            dist/*.artifact.json
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux AppDir archive
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux system packages
        run: tools/ci-linux-deps.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      - name: Build release executable
        run: cargo build --locked --release -p scrozz

      - name: Smoke release executable
        run: tools/smoke.sh

      - name: Package AppDir
        env:
          SCROZZ_APP_VERSION: ${{ needs.prepare.outputs.version }}
          SCROZZ_STAMP: ${{ needs.prepare.outputs.stamp }}
        run: tools/package.sh dist

      - name: Verify Linux package determinism
        env:
          SCROZZ_APP_VERSION: ${{ needs.prepare.outputs.version }}
          SCROZZ_STAMP: ${{ needs.prepare.outputs.stamp }}
        run: |
          tools/package.sh dist-repeat
          cmp dist/*.tar.gz dist-repeat/*.tar.gz
          cmp dist/*.tar.gz.sha256 dist-repeat/*.tar.gz.sha256
          cmp dist/*.tar.gz.artifact.json dist-repeat/*.tar.gz.artifact.json

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.artifact.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [prepare, macos, windows, linux]
    runs-on: ubuntu-latest
    environment: release-publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify artifacts and determine release kind
        id: release_kind
        run: |
          shopt -s nullglob
          archives=(
            release-assets/*.zip
            release-assets/*.msix
            release-assets/*.tar.gz
          )
          metadata=(release-assets/*.artifact.json)
          if [[ "${#archives[@]}" -ne 4 || "${#metadata[@]}" -ne 4 ]]; then
            echo "::error title=Incomplete native release::Expected four archives and four metadata documents."
            exit 1
          fi

          (
            cd release-assets
            for sidecar in *.sha256; do
              sha256sum --check "$sidecar"
            done
          )

          jq -s -e '
            (map(select(.artifact_kind == "macos-app-zip"))) as $mac |
            (map(select(.artifact_kind == "windows-msix"))) as $msix |
            (map(select(.artifact_kind == "windows-portable-zip"))) as $portable |
            (map(select(.artifact_kind == "linux-appdir-tar-gz"))) as $linux |
            ($mac | length) == 1 and
            ($msix | length) == 1 and
            ($portable | length) == 1 and
            ($linux | length) == 1 and
            $mac[0].payload_signed == true and
            $mac[0].notarized == true and
            $msix[0].signed == true and
            $msix[0].payload_signed == true and
            $portable[0].payload_signed == true
          ' release-assets/*.artifact.json >/dev/null

          (
            cd release-assets
            : >SHA256SUMS
            for archive in *.zip *.msix *.tar.gz; do
              sha256sum "$archive" >>SHA256SUMS
            done
          )

          artifact_preview=false
          if jq -s -e 'any(.[]; .preview == true)' \
            release-assets/*.artifact.json >/dev/null; then
            artifact_preview=true
          fi
          preview="${{ needs.prepare.outputs.tag_preview }}"
          if [[ "$artifact_preview" == "true" ]]; then
            preview=true
          fi
          echo "preview=$preview" >>"$GITHUB_OUTPUT"
          echo "artifact_preview=$artifact_preview" >>"$GITHUB_OUTPUT"

          if [[ "$artifact_preview" == "true" ]]; then
            cat >release-notes.md <<'NOTICE'
          > [!WARNING]
          > **Preview build:** at least one native capture backend remains gated.
          > Preview artifacts are labelled in their filenames and include
          > `PREVIEW.txt`; they are not complete production releases.
          NOTICE
          elif [[ "${{ needs.prepare.outputs.tag_preview }}" == "true" ]]; then
            cat >release-notes.md <<'NOTICE'
          Signed native prerelease artifacts for macOS, Windows, and Linux.
          NOTICE
          else
            cat >release-notes.md <<'NOTICE'
          Signed native artifacts for macOS, Windows, and Linux.
          NOTICE
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Scrozz ${{ needs.prepare.outputs.version }}${{ steps.release_kind.outputs.preview == 'true' && ' (Preview)' || '' }}
          prerelease: ${{ steps.release_kind.outputs.preview == 'true' }}
          draft: false
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            release-assets/*.zip
            release-assets/*.msix
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/*.artifact.json
            release-assets/SHA256SUMS
