[package]
name = "scrozz-ocr"
description = "Text recognition over captured images."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
scrozz-core.workspace = true
rxing.workspace = true
thiserror.workspace = true
tracing.workspace = true
isolang = { workspace = true, optional = true }
language-tags.workspace = true
regex.workspace = true

[dev-dependencies]
# Fixtures are generated, never committed: a test encodes a QR or a Code 128 and
# then decodes it back, so the assertion covers the decoder rather than a blob
# whose provenance nobody can check. `encoders` is a dev-only feature, so the
# shipped library never links the writer.
rxing = { workspace = true, features = ["encoders"] }

[features]
default = ["tesseract"]
# Linux text recognition through the *system* `tesseract` binary (D8). Pure
# `std::process`: no C library at build time, nothing bundled, and no engine
# added to the download. It also keeps the portable Windows ZIP functional:
# unpackaged processes cannot activate Windows.Media.Ocr, while MSIX builds can.
tesseract = ["dep:isolang"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-vision.workspace = true
objc2-core-graphics.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Foundation",
    # CopyFromBuffer, so the pixel upload need not hand-write an
    # IMemoryBufferByteAccess vtable.
    "Storage_Streams",
    # TryCreateFromLanguage; without it, requested languages are only advisory.
    "Globalization",
    # Portable artifacts have no package identity and must select Tesseract
    # rather than attempting to activate Windows.Media.Ocr.
    "Win32_Storage_Packaging_Appx",
    # Resolves the user's locale for the portable Tesseract backend.
    "Win32_Globalization",
] }
windows-core.workspace = true

[lints]
workspace = true
