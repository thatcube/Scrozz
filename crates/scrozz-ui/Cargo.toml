[package]
name = "scrozz-ui"
description = "Scrozz's egui surfaces, design tokens, motion, and screenshot harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
scrozz-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
scrozz-annotate.workspace = true
egui.workspace = true
eframe.workspace = true
image.workspace = true
resvg.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# Windows VMs commonly expose Direct3D but no usable OpenGL swap-control
# extension. Enable eframe's wgpu renderer there so the real overlay is not
# gated on a hypervisor's OpenGL support.
eframe = { workspace = true, features = ["wgpu"] }

[lints]
workspace = true
