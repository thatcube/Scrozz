[package]
name = "scrozz-shell"
description = "OS integration: hotkeys, overlay windows, tray, permissions, drag source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
scrozz-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
global-hotkey.workspace = true
tray-icon.workspace = true
dirs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "ApplicationModel",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # autostart.rs: the HKCU ...\CurrentVersion\Run portable registration.
    "Win32_System_Registry",
    # picker.rs: IFileOpenDialog (FOS_PICKFOLDERS) for the folder picker.
    "Win32_UI_Shell",
    # picker.rs: CoCreateInstance/CoInitializeEx for the folder picker's COM
    # dialog, and (per drag.rs's TODO) the eventual DoDragDrop backend.
    "Win32_System_Com",
    "Win32_Storage_Packaging_Appx",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true

[lints]
workspace = true
