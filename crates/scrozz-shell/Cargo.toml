[package]
name = "scrozz-shell"
description = "OS integration: hotkeys, overlay windows, tray, permissions, drag source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
scrozz-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
global-hotkey.workspace = true
tray-icon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true
objc2-core-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    # Drag source: OLE drag-and-drop (`DoDragDrop`), the data object and its
    # format enumerator, the shell drag image helper, and WIC to decode the
    # preview PNG into the bitmap that helper wants.
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Graphics_Imaging",
] }
windows-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
x11rb.workspace = true

[lints]
workspace = true
