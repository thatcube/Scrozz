<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090A0E"/>
      <stop offset="0.52" stop-color="#111014"/>
      <stop offset="1" stop-color="#1D100B"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F05A28" stop-opacity=".22"/>
      <stop offset=".48" stop-color="#F05A28" stop-opacity=".08"/>
      <stop offset="1" stop-color="#F05A28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F05A28" stop-opacity=".25"/>
      <stop offset=".55" stop-color="#FF8A5F"/>
      <stop offset="1" stop-color="#F05A28"/>
    </linearGradient>
    <linearGradient id="caption" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A99D97"/>
      <stop offset="1" stop-color="#918681"/>
    </linearGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="720" height="460" fill="url(#field)"/>
  <ellipse cx="360" cy="258" rx="265" ry="190" fill="url(#ember)"/>
  <ellipse cx="362" cy="252" rx="80" ry="28" fill="#F05A28" opacity=".12" filter="url(#soft-glow)"/>

  <!-- Finder owns icon-label color. Mid-tone plates keep its light and dark
       variants readable without pretending that private metadata can force it. -->
  <g fill="url(#caption)" stroke="#D8CBC5" stroke-opacity=".18">
    <path d="M94 306h172l6 6v30H88v-30z"/>
    <path d="M454 306h172l6 6v30H448v-30z"/>
  </g>

  <g fill="none" stroke="#F05A28" stroke-width="1.5" opacity=".16">
    <path d="M30 66V30h36"/>
    <path d="M654 30h36v36"/>
    <path d="M30 394v36h36"/>
    <path d="M654 430h36v-36"/>
  </g>

  <text x="360" y="70" text-anchor="middle" fill="#FAF7F5"
        font-family="Inter, sans-serif"
        font-size="29" font-weight="700" letter-spacing="-.55">Install Scrozz</text>
  <text x="360" y="101" text-anchor="middle" fill="#C8C0BC"
        font-family="Inter, sans-serif"
        font-size="14" font-weight="500" letter-spacing="-.1">Drag the app into Applications</text>

  <path d="M306 248H410M388 226l22 22-22 22" fill="none" stroke="#F05A28"
        stroke-width="15" stroke-linecap="round" stroke-linejoin="round"
        opacity=".16" filter="url(#soft-glow)"/>
  <path d="M306 248H410M388 226l22 22-22 22" fill="none" stroke="url(#arrow)"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
