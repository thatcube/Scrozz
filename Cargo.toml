[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

# The UI spike is deliberately excluded: it is throwaway, pins its own
# dependency versions, and must not constrain the real build.
exclude = ["spikes/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
authors = ["Brandon Moore"]
repository = "https://github.com/thatcube/scrozz"
homepage = "https://github.com/thatcube/scrozz"

[workspace.dependencies]
# ---- internal ----------------------------------------------------------
scrozz-core = { path = "crates/scrozz-core" }
scrozz-capture = { path = "crates/scrozz-capture" }
scrozz-record = { path = "crates/scrozz-record" }
scrozz-annotate = { path = "crates/scrozz-annotate" }
scrozz-stitch = { path = "crates/scrozz-stitch" }
scrozz-ocr = { path = "crates/scrozz-ocr" }
scrozz-store = { path = "crates/scrozz-store" }
scrozz-export = { path = "crates/scrozz-export" }
scrozz-shell = { path = "crates/scrozz-shell" }
scrozz-ui = { path = "crates/scrozz-ui" }

# ---- external ----------------------------------------------------------
# egui/eframe are 0.x and churn hard between releases; pin exactly. 0.36.1 is
# the current release and its `App` trait is `fn ui(&mut self, ui, frame)`.
# That is upstream, not a patch — see docs/decisions.md D22.
#
# `x11` and `wayland` are not optional extras: without them winit refuses to
# compile for Linux at all ("the platform you're compiling for is not supported
# by winit"), because `default-features = false` strips its display backends.
# Both are enabled so one binary serves X11 and Wayland sessions, which is what
# D8 promises.
eframe = { version = "=0.36.1", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = "=0.36.1"
# Needed to reach the underlying NSView from eframe's CreationContext, which is
# how the overlay window is converted to a non-activating NSPanel (D27).
raw-window-handle = "0.6"

thiserror = "2"
tracing = "0.1"
isolang = { version = "2.4", default-features = false }
language-tags = "0.3"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
dirs = "6"
tiny-skia = "0.12"
resvg = "0.48"
arboard = "3.6"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
# The barcode decoder (OCR-04). A maintained pure-Rust ZXing port, taken with
# `default-features = false` on purpose: the defaults drag in `image`,
# `imageproc` and `resvg` to decode files, and Scrozz already has a decoder and
# hands the reader raw luminance. What is left is `decoders` plus the symbology
# families, whose only non-optional dependencies are chrono, num, once_cell,
# regex and unicode-segmentation. `encoders` is enabled for tests only, where it
# generates the fixtures rather than committing binary blobs.
rxing = { version = "0.9", default-features = false, features = [
    "decoders",
    "encoding_rs",
    "multi_barcode_readers",
    "qrcode",
    "aztec",
    "datamatrix",
    "pdf417",
    "oned",
] }
global-hotkey = "0.8"
tray-icon = "0.24"

# --- macOS ---
objc2 = "0.6"
# Every ScreenCaptureKit completion-handler method is typed `&block2::DynBlock`
# and gated on `feature = "block2"`. No objc2 crate re-exports it, so without
# this those methods are literally unnameable.
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-vision = "0.3"
objc2-av-foundation = "0.3"
objc2-core-media = "0.3"
dispatch2 = "0.3"

# --- Windows ---
windows = "0.62"
# Direct dependency so `#[windows::core::interface]` can generate COM vtables:
# reached only via `windows::core`, the macro emits unresolvable paths.
windows-core = "0.62"

# --- Linux ---
x11rb = { version = "0.14", features = [
    "randr",          # monitor geometry; without it the wire protocol is hand-rolled
    "shm",            # MIT-SHM protocol
    "libc",           # the syscalls MIT-SHM actually needs; "shm" alone is not enough
    "xfixes",         # cursor capture
    "allow-unsafe-code",
] }
ashpd = { version = "0.13", features = [
    "screencast",     # without these the portal cannot be called at all
    "screenshot",
] }

[workspace.lints.rust]
# An unimplemented contract must still compile. Phase 0 is deliberately a tree
# of `todo!()` bodies, so these cannot be denied yet.
unused_variables = "allow"
dead_code = "allow"
missing_docs = "warn"

[workspace.lints.clippy]
todo = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
