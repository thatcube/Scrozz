[package]
name = "scrozz"
description = "Scrozz — screenshots and screen recording for macOS, Windows and Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "scrozz"
path = "src/main.rs"

[dependencies]
scrozz-core.workspace = true
scrozz-capture.workspace = true
scrozz-record.workspace = true
scrozz-annotate.workspace = true
scrozz-stitch.workspace = true
scrozz-ocr.workspace = true
scrozz-store.workspace = true
scrozz-export.workspace = true
scrozz-shell.workspace = true
scrozz-ui.workspace = true
# The app opens the overlay window, so it names eframe directly. scrozz-ui
# builds the whole overlay but deliberately does not depend on scrozz-shell, so
# the app is the only crate that can see both and connect them.
eframe.workspace = true
egui.workspace = true
raw-window-handle.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true
