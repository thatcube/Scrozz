[package]
name = "scrozz"
description = "Scrozz — screenshots and screen recording for macOS, Windows and Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "scrozz"
path = "src/main.rs"

[features]
default = ["rav1e-fallback"]
linux-recording = ["scrozz-record/linux-native"]
rav1e-fallback = ["scrozz-record/rav1e-fallback"]
# Private sharing is opt-in: it is the only feature that links a TLS stack and
# a platform credential vault, so a build that never uploads never pays for
# either. Distributed builds turn it on — see `tools/make-app-bundle.sh`.
cloud = [
    "dep:scrozz-cloud",
    "scrozz-cloud/native-vault",
    "scrozz-cloud/network",
]

[dependencies]
scrozz-core.workspace = true
scrozz-capture.workspace = true
scrozz-record.workspace = true
scrozz-annotate.workspace = true
scrozz-stitch.workspace = true
scrozz-ocr.workspace = true
scrozz-store.workspace = true
scrozz-export.workspace = true
scrozz-cloud = { workspace = true, optional = true }
scrozz-shell.workspace = true
scrozz-ui.workspace = true
# The app opens the overlay window, so it names eframe directly. scrozz-ui
# builds the whole overlay but deliberately does not depend on scrozz-shell, so
# the app is the only crate that can see both and connect them.
eframe.workspace = true
egui.workspace = true
raw-window-handle.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
ctrlc.workspace = true
anyhow.workspace = true
dirs.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
rfd.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true

[lints]
workspace = true
